# Santander Bank UK - Account Product Definitions
# Defines account product types and their statement types

[SANTANDER_UK_CUR_EDGE]
account = "Edge Current Account"
company_key = 'SANTANDER_UK'
account_type_key = 'CUR'
statement_type_key = 'SANTANDER_UK_CUR'
exclude_last_n_pages = 0
currency = "GBP"
    [SANTANDER_UK_CUR_EDGE.config]
    config = 'Account Info'
    # TODO: Adjust coordinates to match account product name location on page 1
    # Typical location: left side of header or account summary section
     locations = [{page_number = 1, top_left = [51, 352], bottom_right = [360, 381]}]
    # Pattern identifies "Current Account" or similar product name on the statement
    field = {field = "account", vital=true, type = "string", string_pattern = "Santander\\s+Edge\\s+current\\s+account"}
